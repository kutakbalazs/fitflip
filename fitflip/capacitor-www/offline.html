<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>FitFlip</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #0a0a0a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 28px
          max(24px, env(safe-area-inset-bottom));
        gap: 22px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #141414;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, serif;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 1px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #a3a3a3;
        margin: 0;
        max-width: 300px;
      }
      button {
        margin-top: 6px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #0a0a0a;
        font-size: 15px;
        font-weight: 600;
        padding: 13px 30px;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }
      button:active {
        opacity: 0.7;
      }
      .status {
        font-size: 13px;
        color: #6b6b6b;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="logo">FF</div>
    <h1 data-i18n="title">Nincs internetkapcsolat</h1>
    <p data-i18n="body">
      A FitFlip működéséhez internet szükséges. Ellenőrizd a kapcsolatod, majd
      próbáld újra.
    </p>
    <button id="retry" data-i18n="retry">Újrapróbálkozás</button>
    <div class="status" id="status"></div>

    <script>
      // Bilingual: match the rest of the app (HU default, EN for English UIs).
      var en = (navigator.language || "hu").toLowerCase().indexOf("en") === 0;
      var t = {
        title: en ? "No internet connection" : "Nincs internetkapcsolat",
        body: en
          ? "FitFlip needs an internet connection. Check your network and try again."
          : "A FitFlip működéséhez internet szükséges. Ellenőrizd a kapcsolatod, majd próbáld újra.",
        retry: en ? "Try again" : "Újrapróbálkozás",
        reconnecting: en ? "Reconnecting…" : "Újracsatlakozás…",
      };
      document.documentElement.lang = en ? "en" : "hu";
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        el.textContent = t[el.getAttribute("data-i18n")];
      });

      var APP_URL = "https://fitflip.app";
      var statusEl = document.getElementById("status");

      function goToApp() {
        statusEl.textContent = t.reconnecting;
        window.location.replace(APP_URL);
      }

      document.getElementById("retry").addEventListener("click", function () {
        if (navigator.onLine === false) {
          statusEl.textContent = t.body;
          return;
        }
        goToApp();
      });

      // Auto-recover the moment the OS reports connectivity is back.
      window.addEventListener("online", goToApp);
    </script>
  </body>
</html>
