<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84B0E4" stop-opacity="0.46"/>
      <stop offset="38%" stop-color="#84B0E4" stop-opacity="0.16"/>
      <stop offset="68%" stop-color="#84B0E4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: darker than the icon tile so the logo stands out -->
  <rect width="2732" height="2732" fill="#0A0C11"/>

  <!-- Breathing blue glow (static frame) behind the tile -->
  <circle cx="1366" cy="1366" r="760" fill="url(#halo)"/>

  <!-- Icon tile -->
  <rect x="1071" y="1071" width="590" height="590" rx="135" fill="#1D1F25"/>
  <rect x="1071" y="1071" width="590" height="590" rx="135" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- FF mark -->
  <text x="1366" y="1476" font-family="Georgia, 'Times New Roman', serif" font-size="300" fill="#E2E2E2" text-anchor="middle" font-weight="600" letter-spacing="-4">FF</text>
</svg>
